<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pet Portrait Price List</title>
<style>
body{font-family:system-ui,sans-serif;background:#f7f3ea;color:#222;margin:0}
.w{max-width:640px;margin:0 auto;padding:16px;box-sizing:border-box}
h1{font-size:1.5rem}
#banner{padding:8px 12px;border-radius:6px;font-weight:bold;margin:10px 0}
.ok{background:#cfe9c9}.bad{background:#f3c2c0}
label{display:block;margin:10px 0 2px}
select,input{font-size:1rem;min-height:44px;width:100%;box-sizing:border-box}
#total{font-size:2rem;font-weight:bold;margin:14px 0 2px}
#how{color:#555;margin:0 0 10px}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse}
td,th{border-bottom:1px solid #ccc;padding:6px;text-align:left;min-width:60px}
</style></head><body>
<script data-bean-store>(function(){if(typeof location!=='undefined'&&location&&location.protocol==='about:'&&typeof document!=='undefined'&&document.addEventListener){document.addEventListener('click',function(e){var a=e.target&&e.target.closest&&e.target.closest('a[href^="#"]');if(!a||a.target==='_blank')return;e.preventDefault();try{location.hash=a.getAttribute('href')}catch(x){}},true)}if(typeof window==='undefined')return;try{window.localStorage.getItem('x');return}catch(e){}var d=Object.assign({},window.__BEAN_SAVED||{});function post(){try{parent.postMessage({type:'bean-store',data:d},'*')}catch(e){}}var ls={getItem:function(k){return Object.prototype.hasOwnProperty.call(d,k)?d[k]:null},setItem:function(k,v){d[k]=String(v);post()},removeItem:function(k){delete d[k];post()},clear:function(){d={};post()},key:function(i){return Object.keys(d)[i]||null}};Object.defineProperty(ls,'length',{get:function(){return Object.keys(d).length}});try{Object.defineProperty(window,'localStorage',{value:ls,configurable:true})}catch(e){}})();</script><div class="w">
<h1>Pet portraits by Bean</h1>
<p>Pencil and ink, one or more animals. Pick a size, a paper and how many pets.</p>
<div id="banner">checking...</div>
<label for="size">Size</label><select id="size"></select>
<label for="paper">Paper</label><select id="paper"></select>
<label for="n">Number of animals</label><input id="n" type="number" min="1" max="6" value="1">
<div id="total"></div><p id="how"></p>
<h2 id="th">Full list (one animal)</h2><div class="sc"><table id="tbl"></table></div>
<p>Each extra animal adds 60% of the base price. Minimum price is 12.</p>
</div>
<script>
var SIZES={A6:15,A5:25,A4:40,A3:65};
var PAPERS={Plain:0,Cotton:8,Heavy:5};
var FLOOR=12;
function price(size,paper,n,sizes,papers){
  sizes=sizes||SIZES;papers=papers||PAPERS;
  if(!(size in sizes)||!(paper in papers)||!(n>=1)||n!==Math.floor(n))return NaN;
  var base=sizes[size]+papers[paper];
  return Math.max(FLOOR,Math.round(base*(1+0.6*(n-1))));
}
function brokenPrice(size,paper,n,sizes,papers){ // ignores extra animals, no floor
  sizes=sizes||SIZES;papers=papers||PAPERS;
  if(!(size in sizes)||!(paper in papers))return NaN;
  return sizes[size]+papers[paper];
}
function noFloorPrice(size,paper,n,sizes,papers){ // forgets the minimum
  sizes=sizes||SIZES;papers=papers||PAPERS;
  if(!(size in sizes)||!(paper in papers)||!(n>=1)||n!==Math.floor(n))return NaN;
  return Math.round((sizes[size]+papers[paper])*(1+0.6*(n-1)));
}
var T={X:5,Y:12,Z:13,H:7.5,W:20};
var CASES=[
 ['A6','Plain',1,15,0],['A6','Plain',2,24,0],['A4','Cotton',2,77,0],
 ['A3','Heavy',1,70,0],['A3','Heavy',6,280,0],
 ['A6','Plain',0,NaN,0],['A6','Plain',1.5,NaN,0],['A6','Plain',-1,NaN,0],
 ['A9','Plain',1,NaN,0],['A6','Gold',1,NaN,0],['A6','Plain',NaN,NaN,0],
 ['X','Plain',1,12,1],   // below floor clamps up
 ['Y','Plain',1,12,1],   // exact tie
 ['Z','Plain',1,13,1],   // just above
 ['H','Plain',1,12,1],   // 7.5 rounds to 8, floor wins
 ['W','Plain',2,32,1]    // 20*1.6=32
];
function same(a,b){return (a!==a&&b!==b)||a===b;}
function run(fn){var f=0;CASES.forEach(function(c){
 var r=c[4]?fn(c[0],c[1],c[2],T,PAPERS):fn(c[0],c[1],c[2]);
 if(!same(r,c[3]))f++;});return f;}
var realFails=run(price),b1=run(brokenPrice),b2=run(noFloorPrice);
var b=document.getElementById('banner');
if(realFails===0&&b1>0&&b2>0){b.className='ok';b.textContent='Checks pass; broken copies caught ('+b1+' and '+b2+' failures)';}
else{b.className='bad';b.textContent='CHECK PROBLEM: real fails '+realFails+', broken fails '+b1+' / '+b2;}
var S=document.getElementById('size'),P=document.getElementById('paper'),N=document.getElementById('n');
Object.keys(SIZES).forEach(function(k){S.add(new Option(k,k));});
Object.keys(PAPERS).forEach(function(k){P.add(new Option(k,k));});
function table(n){
 var h='<tr><th>Size</th>';Object.keys(PAPERS).forEach(function(p){h+='<th>'+p+'</th>';});h+='</tr>';
 Object.keys(SIZES).forEach(function(s){h+='<tr><td>'+s+'</td>';Object.keys(PAPERS).forEach(function(p){h+='<td>'+price(s,p,n)+'</td>';});h+='</tr>';});
 document.getElementById('tbl').innerHTML=h;
 document.getElementById('th').textContent='Full list ('+n+(n===1?' animal)':' animals)');}
function upd(){var n=Number(N.value);var v=price(S.value,P.value,n);var ok=v===v;
 document.getElementById('total').textContent=ok?'Price: '+v:'Pick 1 or more animals';
 document.getElementById('how').textContent=ok?S.value+' + '+P.value+' paper, '+n+(n===1?' animal':' animals'):'Whole numbers only, 1 or more.';
 table(ok?n:1);}
[S,P,N].forEach(function(e){e.addEventListener('input',upd);});
upd();
</script></body></html>
